# Builds the app on a real Windows runner.
#
# This exists because the build chain is the part that keeps breaking, and none
# of it can be exercised anywhere else: PowerShell parse errors, a PyInstaller
# bundle that starts on the developer's machine and not from the installer, a
# resource path that resolves differently under `tauri build`. Every one of
# those shipped at least once. A green run here is the only evidence that the
# installer actually builds.
#
# Push or PR: build and keep the installer as an artifact.
# Tag v*:     the same build, published as a GitHub Release.

name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes an in-flight Windows build pointless.
# Tags are never cancelled -- that build becomes a release.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: write # needed only by the release step

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # The suite includes tests that read dist/index.html, so the frontend is
      # built first. Nothing here needs an Apple account or a network call.
      - name: Build the frontend
        run: |
          node scripts/ui.mjs install
          node scripts/ui.mjs run build

      - name: Install the sidecar
        run: pip install ./sidecar pytest

      - name: Run the suite
        working-directory: sidecar
        run: python -m pytest -q

  windows:
    name: Windows installer
    runs-on: windows-latest
    needs: tests
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: dtolnay/rust-toolchain@stable

      # A cold Rust build of the Tauri tree is many minutes; this is the
      # difference between a useful check and one nobody waits for.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # A tag that disagrees with the version in the config would ship an
      # installer claiming the wrong version, and later tell the updater a
      # release it already has is new. Catch it before building for 10 minutes.
      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $tag = "${{ github.ref_name }}".TrimStart("v")
          $cfg = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          if ($tag -ne $cfg) {
            throw "Tag v$tag does not match tauri.conf.json version $cfg. Bump the version and re-tag."
          }
          Write-Host "Version $cfg matches the tag."

      # createUpdaterArtifacts makes `tauri build` sign the installer, and it
      # fails outright without a key. Better to say which secret is missing now
      # than to discover it eleven minutes into a Rust build.
      - name: Check the signing key is available
        run: |
          if (-not "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}") {
            throw "TAURI_SIGNING_PRIVATE_KEY is not set. Add it under Settings -> Secrets and variables -> Actions. It is the private key from `npm run tauri signer generate`; the matching public key is already in tauri.conf.json."
          }
          Write-Host "Signing key present."

      - name: Install npm dependencies
        run: npm install

      - name: Freeze the Python sidecar
        run: .\scripts\build-sidecar.ps1

      # The signing key turns the build's updater artifacts into something the
      # installed app will accept. Without these two the build fails; with a
      # mismatched key it succeeds and every client silently rejects the update.
      - name: Build the installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run build

      # Proof the sidecar actually travelled inside the installers. It has
      # shipped without it before, and the app is dead on arrival when it does.
      #
      # The sidecar is a bundled resource, so it is *inside* the .msi and .exe;
      # the bundle directory only ever holds the installers themselves. So this
      # unpacks them and looks. Matching is by content hash rather than by name,
      # because an MSI stores its payload in a cab under names of its own
      # choosing -- a hash match is also the stronger claim: not merely that
      # something called reminders-sidecar.exe is in there, but that the binary
      # the freeze step smoke-tested is the one that shipped.
      - name: Check the sidecar travelled inside the installers
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false

          $expected = Get-Item dist-sidecar\reminders-sidecar.exe
          $want = (Get-FileHash $expected.FullName -Algorithm SHA256).Hash
          Write-Host "Looking for $($expected.Length) bytes, SHA256 $want"

          $installers = @(Get-ChildItem -Recurse -Path src-tauri\target\release\bundle -Include *.msi, *-setup.exe)
          if ($installers.Count -lt 2) {
            throw "expected an msi and an nsis installer, found $($installers.Count)"
          }

          foreach ($installer in $installers) {
            $out = Join-Path $env:RUNNER_TEMP ([IO.Path]::GetRandomFileName())
            & "7z" x -y "-o$out" $installer.FullName | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "7z could not unpack $($installer.Name)" }

            # An MSI keeps its payload in a cab; open that too before looking.
            foreach ($cab in Get-ChildItem -Recurse -File -Path $out -Filter *.cab -ErrorAction SilentlyContinue) {
              & "7z" x -y "-o$out" $cab.FullName | Out-Null
            }

            $unpacked = Get-ChildItem -Recurse -File -Path $out -ErrorAction SilentlyContinue
            $hit = $unpacked |
                   Where-Object { $_.Length -eq $expected.Length } |
                   Where-Object { (Get-FileHash $_.FullName -Algorithm SHA256).Hash -eq $want } |
                   Select-Object -First 1

            if (-not $hit) {
              Write-Host "--- $($unpacked.Count) files unpacked from $($installer.Name) ---"
              $unpacked | Select-Object -First 100 -Property Name, Length |
                Format-Table | Out-String | Write-Host
              throw "the sidecar is not inside $($installer.Name)."
            }
            Write-Host "$($installer.Name): sidecar present as $($hit.Name)"
          }

      - name: Upload the installers
        uses: actions/upload-artifact@v4
        with:
          name: installers
          retention-days: 14
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

      # `gh` is preinstalled on the runner, so this needs no third-party action.
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false

          $nsis = "src-tauri\target\release\bundle\nsis"
          $setup = Get-ChildItem -Path $nsis -Filter *-setup.exe | Select-Object -First 1
          $sig = Get-ChildItem -Path $nsis -Filter *-setup.exe.sig | Select-Object -First 1
          if (-not $setup) { throw "no NSIS installer to publish" }
          if (-not $sig) {
            throw "no .sig beside the installer -- the build did not produce updater artifacts, so this release would be invisible to installed apps."
          }
          $msi = Get-ChildItem -Recurse -Path src-tauri\target\release\bundle -Filter *.msi |
                 Select-Object -First 1

          # A release may already exist -- someone drafted one by hand, or an
          # earlier attempt at this tag got as far as creating it and then
          # failed. `gh release create` errors on both, which made the release
          # job unable to run twice: any failure after this line left the tag
          # permanently unreleasable without deleting the release by hand.
          gh release view "${{ github.ref_name }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release ${{ github.ref_name }} exists; uploading into it."
            gh release upload "${{ github.ref_name }}" $setup.FullName $msi.FullName --clobber
            if ($LASTEXITCODE -ne 0) { throw "could not upload installers to the existing release" }
          } else {
            gh release create "${{ github.ref_name }}" $setup.FullName $msi.FullName `
              --title "${{ github.ref_name }}" `
              --generate-notes
            if ($LASTEXITCODE -ne 0) { throw "gh release create failed" }
          }

          # latest.json is what installed copies poll. It has to name the asset
          # by the URL GitHub actually serves, and GitHub rewrites spaces in
          # asset names ("iCloud Reminders_..." becomes "iCloud.Reminders_..."),
          # so the local filename is the wrong thing to build a URL from. Ask
          # the API for the name it gave the asset.
          $release = gh release view "${{ github.ref_name }}" --json assets | ConvertFrom-Json
          $asset = $release.assets | Where-Object { $_.name -like "*-setup.exe" } | Select-Object -First 1
          if (-not $asset) { throw "the installer is not among the uploaded assets" }

          $manifest = [ordered]@{
            version = "${{ github.ref_name }}".TrimStart("v")
            notes = "See the release notes for ${{ github.ref_name }}."
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = (Get-Content $sig.FullName -Raw).Trim()
                url = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$($asset.name)"
              }
            }
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content latest.json -Encoding utf8
          Get-Content latest.json | Write-Host

          # --clobber for the same reason: a re-run must replace the manifest,
          # not fail because one is already attached.
          gh release upload "${{ github.ref_name }}" latest.json --clobber
          if ($LASTEXITCODE -ne 0) { throw "could not upload latest.json" }
