# Builds the app on a real Windows runner.
#
# This exists because the build chain is the part that keeps breaking, and none
# of it can be exercised anywhere else: PowerShell parse errors, a PyInstaller
# bundle that starts on the developer's machine and not from the installer, a
# resource path that resolves differently under `tauri build`. Every one of
# those shipped at least once. A green run here is the only evidence that the
# installer actually builds.
#
# Push or PR: build and keep the installer as an artifact.
# Tag v*:     the same build, published as a GitHub Release.

name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes an in-flight Windows build pointless.
# Tags are never cancelled -- that build becomes a release.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: write # needed only by the release step

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # The suite includes tests that read dist/index.html, so the frontend is
      # built first. Nothing here needs an Apple account or a network call.
      - name: Build the frontend
        run: |
          node scripts/ui.mjs install
          node scripts/ui.mjs run build

      - name: Install the sidecar
        run: pip install ./sidecar pytest

      - name: Run the suite
        working-directory: sidecar
        run: python -m pytest -q

  windows:
    name: Windows installer
    runs-on: windows-latest
    needs: tests
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: dtolnay/rust-toolchain@stable

      # A cold Rust build of the Tauri tree is many minutes; this is the
      # difference between a useful check and one nobody waits for.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # A tag that disagrees with the version in the config would ship an
      # installer claiming the wrong version, and later tell the updater a
      # release it already has is new. Catch it before building for 10 minutes.
      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $tag = "${{ github.ref_name }}".TrimStart("v")
          $cfg = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          if ($tag -ne $cfg) {
            throw "Tag v$tag does not match tauri.conf.json version $cfg. Bump the version and re-tag."
          }
          Write-Host "Version $cfg matches the tag."

      - name: Install npm dependencies
        run: npm install

      - name: Freeze the Python sidecar
        run: .\scripts\build-sidecar.ps1

      - name: Build the installer
        run: npm run build

      # Proof the sidecar actually travelled with the bundle. The installer has
      # shipped without it before, and the app is dead on arrival when it does.
      - name: Check the sidecar is in the bundle
        run: |
          $found = Get-ChildItem -Recurse -Path src-tauri\target\release\bundle -Filter reminders-sidecar.exe -ErrorAction SilentlyContinue
          if (-not $found) {
            Get-ChildItem -Recurse src-tauri\target\release\bundle | Select-Object -ExpandProperty FullName
            throw "reminders-sidecar.exe is not inside the bundle output."
          }
          Write-Host "Sidecar bundled: $($found[0].FullName)"

      - name: Upload the installers
        uses: actions/upload-artifact@v4
        with:
          name: installers
          retention-days: 14
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

      # `gh` is preinstalled on the runner, so this needs no third-party action.
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = Get-ChildItem -Recurse -Path src-tauri\target\release\bundle -Include *.msi, *-setup.exe |
                   Select-Object -ExpandProperty FullName
          gh release create "${{ github.ref_name }}" $files `
            --title "${{ github.ref_name }}" `
            --generate-notes
