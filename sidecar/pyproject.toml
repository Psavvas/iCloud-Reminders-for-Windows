[project]
name = "reminders-sidecar"
version = "0.1.0"
description = "iCloud Reminders sidecar for the Tauri shell"
requires-python = ">=3.11"
dependencies = [
    "pyicloud>=2.6.5",
    "keyring>=25.0",
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.scripts]
reminders-sidecar = "reminders_sidecar.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
