<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>iCloud Reminders</title>
  <!--
    Inline, ahead of the bundle. WebView2 paints its default white before the
    stylesheet arrives, which on a dark theme is a white flash on every launch.
    This is the only style that has to beat the CSS file to the screen, so it
    is the only one that lives here.
  -->
  <style>
    :root { background: #ffffff; }
    :root[data-theme="dark"] { background: #1c1c1e; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { background: #1c1c1e; }
    }
    /* The Fluent interface sits on a different ground colour, so the flash it
       is avoiding is a different one. Same three cases, its own two values. */
    :root[data-ui="winui"] { background: #f3f3f3; }
    :root[data-ui="winui"][data-theme="dark"] { background: #202020; }
    @media (prefers-color-scheme: dark) {
      :root[data-ui="winui"]:not([data-theme="light"]) { background: #202020; }
    }
  </style>
  <!--
    The theme and the interface style both live in the sidecar's settings, which
    takes a round trip to read. A copy of each in localStorage is readable now,
    so someone who chose Dark on a light Windows does not get a white flash on
    every launch -- nor an Apple-white one on the way into the Fluent interface.
  -->
  <script>
    try {
      var root = document.documentElement;
      var t = localStorage.getItem("theme");
      if (t === "light" || t === "dark") root.dataset.theme = t;
      if (localStorage.getItem("ui_style") === "winui") root.dataset.ui = "winui";
    } catch (e) { /* private mode, or storage disabled */ }
  </script>
</head>
<body>
  <div id="root"></div>
  <!-- Populated by the print sheet; the only thing @media print shows. -->
  <div id="print-view" class="print-view" aria-hidden="true"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
